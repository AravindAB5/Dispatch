spring:
  application:
    name: dispatch-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dispatch}
    username: ${DATABASE_USERNAME:dispatch}
    password: ${DATABASE_PASSWORD:dispatch}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    com.dispatch: INFO

dispatch:
  security:
    jwt:
      # Development-only default. Always override DISPATCH_JWT_SECRET outside local development.
      secret: ${DISPATCH_JWT_SECRET:dispatch-local-development-secret-change-me-0123456789}
      issuer: dispatch
      ttl: ${DISPATCH_JWT_TTL:12h}
    ingest-api-key: ${DISPATCH_INGEST_API_KEY:dispatch-dev-ingest-key}
  cors:
    allowed-origins: ${DISPATCH_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    enabled: ${DISPATCH_SEED_ENABLED:false}
  bootstrap-admin:
    name: ${DISPATCH_ADMIN_NAME:Administrator}
    email: ${DISPATCH_ADMIN_EMAIL:}
    password: ${DISPATCH_ADMIN_PASSWORD:}
  simulator:
    enabled: ${DISPATCH_SIMULATOR_ENABLED:false}
    auto-start: ${DISPATCH_SIMULATOR_AUTO_START:false}
    interval: ${DISPATCH_SIMULATOR_INTERVAL:3s}
    max-concurrent-problems: ${DISPATCH_SIMULATOR_MAX_PROBLEMS:6}
