# Dispatch - full local environment.
#
#   docker compose up --build
#
# Frontend  http://localhost:3000
# API       http://localhost:8080
# Postgres  localhost:5432 (dispatch / dispatch)
#
# Every value can be overridden from the shell or a .env file (see .env.example).

name: dispatch

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dispatch}
      DATABASE_USERNAME: ${POSTGRES_USER:-dispatch}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dispatch}
      DISPATCH_JWT_SECRET: ${DISPATCH_JWT_SECRET:-dispatch-local-development-secret-change-me-0123456789}
      DISPATCH_JWT_TTL: ${DISPATCH_JWT_TTL:-12h}
      DISPATCH_INGEST_API_KEY: ${DISPATCH_INGEST_API_KEY:-dispatch-dev-ingest-key}
      DISPATCH_CORS_ALLOWED_ORIGINS: ${DISPATCH_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DISPATCH_SEED_ENABLED: ${DISPATCH_SEED_ENABLED:-true}
      DISPATCH_SIMULATOR_ENABLED: ${DISPATCH_SIMULATOR_ENABLED:-true}
      DISPATCH_SIMULATOR_AUTO_START: ${DISPATCH_SIMULATOR_AUTO_START:-true}
      DISPATCH_SIMULATOR_INTERVAL: ${DISPATCH_SIMULATOR_INTERVAL:-3s}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle: the address the *browser* uses to reach the API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: ${NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS:-true}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
